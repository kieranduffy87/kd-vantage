<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KD Vantage</title>
<meta name="description" content="A device mockup studio. Real-time 3D devices built entirely in three.js, your own screens on them, exported from every angle.">
<link rel="icon" href="assets/kd-mark.svg">
<link rel="stylesheet" href="fonts/instrument-sans.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/kd.css">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>

<header class="top">
  <div class="top__left">
    <img src="assets/kd-icon-light.svg" alt="KD" class="top__mark" id="top-mark" width="22" height="14">
    <span class="top__app">Vantage</span>
    <span class="top__sep">/</span>
    <span class="top__crumb">Drafts</span>
    <span class="top__sep">/</span>
    <input class="top__name" id="doc-name" spellcheck="false" aria-label="File name">
  </div>

  <div class="top__mid">
    <div class="seg seg--sm" id="mode-seg" role="radiogroup" aria-label="View mode">
      <button type="button" data-v="3d" role="radio">3D</button>
      <button type="button" data-v="2d" role="radio">2D</button>
    </div>
    <div class="tools" role="toolbar" aria-label="Tools">
      <button type="button" class="tool" data-tool="select" title="Select & move (V)" aria-label="Select">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 7.5-6.2 1.6L10 18.5z"/></svg>
      </button>
      <button type="button" class="tool" data-tool="hand" title="Orbit only (H)" aria-label="Orbit">
        <svg viewBox="0 0 24 24"><path d="M7 11V6.5a1.5 1.5 0 013 0V11m0-1V4.5a1.5 1.5 0 013 0V10m0 0V5.5a1.5 1.5 0 013 0V12m0-3.5a1.5 1.5 0 013 0V14a7 7 0 01-7 7h-1.2a6 6 0 01-4.6-2.2L4.6 15.4a1.6 1.6 0 012.4-2.1L8 14.5"/></svg>
      </button>
      <span class="tools__div"></span>
      <div class="menuwrap">
        <button type="button" class="tool" id="btn-add" title="Add device (D)" aria-label="Add device" aria-haspopup="menu">
          <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        </button>
        <div class="menu" id="menu-add" role="menu" hidden></div>
      </div>
      <button type="button" class="tool" id="btn-text" title="Add text (T)" aria-label="Add text">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
      </button>
      <button type="button" class="tool" id="btn-light" title="Lighting (L)" aria-label="Lighting">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="tool" id="btn-snap" title="Quick export PNG (⌘E)" aria-label="Quick export">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <span class="tools__div"></span>
      <button type="button" class="tool" id="btn-undo" title="Undo (⌘Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button type="button" class="tool" id="btn-redo" title="Redo (⇧⌘Z)" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
    </div>
  </div>

  <div class="top__right">
    <span class="fps" id="fps"><i></i><b>—</b></span>
    <button type="button" class="tool" id="btn-theme" title="Interface theme" aria-label="Switch interface theme">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
    </button>
    <button type="button" class="btn btn--primary" id="btn-export">Export</button>
  </div>
</header>

<main class="work">
  <aside class="panel panel--left" aria-label="Layers and assets">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="layers">Layers</button>
      <button type="button" role="tab" data-tab="assets">Assets</button>
    </div>
    <div class="panel__body" id="left-body"></div>
  </aside>

  <section class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="gl"></canvas>
      <canvas id="ink" class="ink"></canvas>
      <div class="sel" id="sel"></div>
      <div class="drop" id="drop"><span>Drop to put it on screen</span></div>
    </div>
    <div class="dock">
      <div class="dock__grp">
        <button type="button" class="dock__btn" id="btn-fit" title="Re-frame (F)">Fit</button>
        <button type="button" class="dock__btn" id="btn-zout" aria-label="Zoom out">−</button>
        <span class="dock__zoom" id="zoom">100%</span>
        <button type="button" class="dock__btn" id="btn-zin" aria-label="Zoom in">+</button>
      </div>
      <div class="dock__grp" id="cam-presets"></div>
    </div>
    <p class="hint" id="hint">Drag a device to move it · drag empty space to orbit · scroll to zoom · drop an image or video on a screen</p>
  </section>

  <aside class="panel panel--right" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-rtab="design">Design</button>
      <button type="button" role="tab" data-rtab="motion">Motion</button>
      <button type="button" role="tab" data-rtab="export">Export</button>
    </div>
    <div class="panel__body" id="right-body"></div>
  </aside>
</main>

<input type="file" id="file-in" accept="image/*,video/*" hidden>
<input type="file" id="proj-in" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
